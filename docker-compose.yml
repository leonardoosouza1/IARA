services:
  saci-brain:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saci_trader_bot
    restart: unless-stopped
    
    # Port mapping (FastAPI API Server)
    ports:
      - "8000:8000"
    
    # Mapeamento de Volumes
    volumes:
      - ./backend/src:/app/src
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./plots:/app/plots
      - ./checkpoints:/app/checkpoints
      - ./reports:/app/reports
    
    # Shared Memory (Critical for PyTorch DataLoader with Workers)
    shm_size: '8gb'
      
    # Configurações Críticas para AMD ROCm (RX 6750 XT)
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
      
    # Environment
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - PYTHONPATH=/app
      - FRONTEND_URL=http://localhost:3000
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=true
    
    # Command: Launch IARA API Server
    command: ["python", "-m", "src.api.main"]
    
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:rocm
    container_name: ollama_service
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
    # Command to serve.
    # To pull model automatically, one might need a custom entrypoint, 
    # but standard image entrypoint is 'serve'.

