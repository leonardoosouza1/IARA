services:
  saci-brain:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: saci_trader_bot
    restart: unless-stopped
    
    # Mapeamento de Volumes
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./plots:/app/plots
      - ./checkpoints:/app/checkpoints
      - ./reports:/app/reports
    
    # Shared Memory (Critical for PyTorch DataLoader with Workers)
    shm_size: '8gb'
      
    # Configurações Críticas para AMD ROCm (RX 6750 XT)
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
      
    # Variável Mágica para RDNA2 (Sua GPU)
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - PYTHONPATH=/app
    
    stdin_open: true
    tty: true
